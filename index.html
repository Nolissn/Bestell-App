<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="./styles/variables.css" />
    <link rel="stylesheet" href="./styles/standard.css" />
    <link rel="stylesheet" href="./styles/fonts.css" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./styles/assets.css" />

    <link
      rel="icon"
      type="image/png"
      href="./assets/favicon/favicon-96x96.png"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="./assets/favicon/favicon.svg" />
    <link rel="shortcut icon" href="./assets/favicon/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./assets/favicon/apple-touch-icon.png"
    />
    <meta name="apple-mobile-web-app-title" content="Bestell App" />
    <link rel="manifest" href="./assets/favicon/site.webmanifest" />

    <script src="./scripts/db.js" defer></script>
    <script src="./scripts/template.js" defer></script>
    <script src="./scripts/basket.js"></script>
    <script src="./script.js" defer></script>

    <title>Bestell App</title>
  </head>
  <body onload="init()">
    <header>
      <img
        class="header_icon"
        src="./assets/icons/SVG/header_icon.svg"
        alt="Bestell App Icon"
      />
      <img
        class="header_burger_menu_icon"
        src="./assets/icons/SVG/burger_menu_icon.svg"
        alt="Burger Menü Icon"
      />
    </header>
    <div class="hero_image_container">
      <img
        class="hero-image"
        src="./assets/images/PNG/hero_image.png"
        alt="BurgerHouse Big Picture"
      />
      <img
        class="burger_house_brand_icon"
        src="./assets/images/PNG/burger_hero_icon.png"
        alt="BurgerHouse Brand Icon"
      />
    </div>
    <section class="headline_section">
      <div class="headline_section_h1_and_review_div">
        <h1><span>Burger</span>House</h1>
        <img
          src="./assets/images/SVG/review.svg"
          alt="Reviews Template Image"
        />
      </div>
      <p class="headline_section_p_tag">
        The best of Burgers, Pizza, and Greens, all in one great place.
      </p>
    </section>
    <aside class="basket" id="basketContentId"></aside>
    <main>
      <section class="burger_and_sandwiches_section">
        <header>
          <img
            class="burger_and_sandwiches_section_header_icon"
            src="./assets/icons/SVG/burger_and_sandwiches_section_header_icon.svg"
            alt="Burger and sandwiches section header icon"
          />
          <p class="section_headline">Burger & Sandwiches</p>
        </header>
        <div class="food_content" id="burgerAndSandwichesContentId"></div>
      </section>
      <section class="pizza_section">
        <header>
          <img
            class="pizza_section_header_icon"
            src="./assets/icons/SVG/pizza_section_header_icon.svg"
            alt="Pizza section header icon"
          />
          <p class="pizza_section_header_extra_text">
            <span class="section_headline">Pizza</span> (30cm)
          </p>
        </header>
        <div class="food_content" id="pizzaContentId"></div>
      </section>
      <section class="salad_section">
        <header>
          <img
            class="salad_section_header_icon"
            src="./assets/icons/SVG/salad_section_header_icon.svg"
            alt="Salad section header icon"
          />
          <p class="section_headline">Salad</p>
        </header>
        <div class="food_content" id="saladContentId"></div>
      </section>
    </main>
    <footer>
      <div class="footer_copyright_icon_and_text_wrapper_div">
        <img
          class="footer_copyright_icon"
          src="./assets/icons/SVG/copyright.svg"
          alt="Copyright Icon"
        />
        <p>2025 BurgerHouse</p>
      </div>
      <p>Imprint</p>
      <p>Cookie Preferences</p>
    </footer>
  </body>
</html>
